name: Baseer
options:
  bundleIdPrefix: io.github.sfertalain2003
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Baseer:
    type: application
    platform: iOS
    sources: [Baseer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sfertalain2003.baseer
        PRODUCT_NAME: Baseer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Baseer/Info.plist
      properties:
        CFBundleDisplayName: بصير
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "بصير يستخدم الكاميرا ليوصف لك ما أمامك. Baseer uses the camera to describe what is in front of you."
        NSMicrophoneUsageDescription: "بصير يسمع كلامك لتعطيه الأوامر بالصوت. Baseer listens so you can talk to it."
        NSLocationWhenInUseUsageDescription: "بصير يستخدم موقعك ليقول لك أين أنت ويوجهك. Baseer uses your location to tell you where you are."
        NSSpeechRecognitionUsageDescription: "بصير يفهم أوامرك الصوتية. Baseer understands your voice commands."
